name: Copilot Setup Steps

# CodeMe Copilot environment smoke test: keep this aligned with scripts/test-ci.sh.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        id: chrome

      - name: Prove the CI test gate
        env:
          CI: "true"
          CODEME_SKIP_LIVE: "1"
          CODEME_BROWSER_HEADLESS: "1"
          CODEME_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: sh scripts/test-ci.sh
